<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A LEGENDA | Oferte Standard și Industriale</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">A Legenda</a>
        <p>Catalog complet de produse și ambalaje industriale</p>
    </header>

    <div class="hero">
        <h1>Găsește cele mai bune oferte</h1>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Caută produse (ex: saci, flacon, borcan)...">
            <button onclick="handleSearch()" class="search-btn">Caută</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="content-area">
            <div id="resultsCount" class="results-count">Se încarcă catalogul de produse de la 2Performant...</div>
            <div id="productsGrid" class="products-grid"></div>
        </div>
    </div>

    <script src="logica.js"></script>
</body>
</html>
